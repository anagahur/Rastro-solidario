[profile.default]
src = "contracts/src"
test = "contracts/test"
script = "contracts/script"
out = "contracts/out"
cache_path = "contracts/cache"
libs = ["contracts/lib", "node_modules"]
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
# Monad permite contratos de hasta 128 KB (Ethereum: 24 KB). Anvil corre con el mismo límite.
code_size_limit = 131072
ffi = false
fs_permissions = [
  { access = "read", path = "./" },
  { access = "write", path = "./reports" }
]
remappings = [
  "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
  "forge-std/=contracts/lib/forge-std/src/"
]

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 64
depth = 64
fail_on_revert = false

[profile.ci.fuzz]
runs = 1000

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
quote_style = "double"
number_underscore = "thousands"

# Monad testnet: chain id 10143
[rpc_endpoints]
monad_testnet = "${MONAD_RPC_URL}"
local = "http://127.0.0.1:8545"
